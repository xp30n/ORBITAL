<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <title>ORBITAL | MISSION CONTROL</title>
  </head>
  <body>
    <h1>Welcome aboard, {{ name }}.</h1>

    <p>Assigned Planet: {{ planet }}</p>
    <p>Mission Designation: {{ mission }}</p>

    <ul>
      {% for planet in planet_data %}
      <li>
        <h2>{{ planet.name}} | {{ planet.type}} </h2>
        <p>Moons : {{ planet.moons}}</p>
      </li>
      {% endfor %}
    </ul>
  </body>
</html>
